services:
  # Single Web Service (Backend + Frontend)
  - type: web
    name: ai-sitebuilder
    env: node
    region: oregon
    plan: free
    buildCommand: |
      cd client && npm install && npm run build
      cd ../server && npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: cd server && NODE_ENV=production npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: TRUSTED_ORIGINS
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

databases:
  - name: ai-sitebuilder-db
    plan: free
    databaseName: sitebuilder
    user: sitebuilder_user