services:
  - type: web
    name: ai-sitebuilder-backend
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: TRUSTED_ORIGINS
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: COOKIE_DOMAIN
        value: ai-sitebuilder-hhsc.onrender.com